<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' data: https:; style-src 'unsafe-inline' https:; img-src data: https:; media-src data: https:; font-src data: https:; connect-src https: http://localhost:* http://127.0.0.1:*; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Preview</title>
<!-- An HTML file, seen in Jean's preview (D126), or a page of the user's folder in the browser (D156,
     its scripts and modules as data): loaded in <iframe sandbox="allow-scripts">, so its
     origin is opaque and it can't read Jean's storage. The page Jean sends replaces this one and
     keeps its policy, the most Settings can allow (D143). The relay writes the policy Jean sends
     ahead of the page, which adds to this one: by default the page's own scripts run, but nothing
     loads from anywhere and nothing is sent, and no form or pop-up opens. Jean's own frame-src
     keeps the frame from being taken elsewhere; its links lead nowhere from here, except within
     the page: the browser is told where they lead, and may follow. A doctype first, or the policy
     would put every page in quirks mode. -->
<script>onmessage = ({ data, source }) => {
  if (source !== parent || typeof data?.page !== 'string' || typeof data?.policy !== 'string') return
  document.open()
  document.write(`<!doctype html><meta http-equiv="Content-Security-Policy" content="${data.policy.replaceAll('"', '&quot;')}">`)
  document.write(data.page)
  document.close()
  document.addEventListener('click', (event) => {
    const link = event.target.closest?.('a[href]:not([href^="#"])')
    if (!link || event.defaultPrevented) return
    event.preventDefault()
    parent.postMessage({ open: link.getAttribute('href') }, '*')
  })
}
</script>
</html>
