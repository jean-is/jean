# Reefknot Mutual's sign-in: Dex, with Jean as a public app (PKCE, no secret, as a page in a browser
# is) and one person in its own list. Dex can put the directory you already have behind it with a
# connector (LDAP, SAML, Entra ID, Google), or Jean signs in to that one directly, Google excepted (below).
issuer: http://localhost:5556/dex

# Its pages in Reefknot's name, logo and colours: brand/, mounted as the theme below.
frontend:
  dir: /srv/dex/web
  theme: reefknot
  issuer: Reefknot Mutual
  logoURL: theme/logo.svg

storage:
  type: memory

web:
  http: 0.0.0.0:5556
  # Jean signs in from the browser: discovery, the token endpoint and the keys answer its address.
  allowedOrigins: ["http://localhost:8080"]

oauth2:
  skipApprovalScreen: true
  pkce:
    enforce: true
    codeChallengeMethodsSupported: ["S256"]

expiry:
  # The access token Jean sends the gateway, renewed with its refresh token before it ends.
  idTokens: 1h

staticClients:
  - id: jean
    name: Jean
    public: true
    # Jean's address, which it comes back to from signing in.
    redirectURIs: ["http://localhost:8080/"]

# Google Workspace in place of the list below, its accounts alone. Jean can't sign in to Google
# directly, so it goes through Dex (docs/enterprise.md, "Signing in at work"). Uncomment, set the
# GOOGLE_ values in .env, and remove enablePasswordDB and staticPasswords.
# connectors:
#   - type: google
#     id: google
#     name: Google
#     config:
#       clientID: $GOOGLE_CLIENT_ID
#       clientSecret: $GOOGLE_CLIENT_SECRET
#       # Dex's issuer followed by /callback, as Google's OAuth client lists it.
#       redirectURI: http://localhost:5556/dex/callback
#       # Every other account is turned away.
#       hostedDomains: ["reefknot.example"]
#       # Without it, Google asks for consent at every sign-in.
#       promptType: ""
#       # Each person's groups, for policy by group: a service account's key, and a Workspace user who can read groups.
#       # serviceAccountFilePath: /etc/dex/google.json
#       # domainToAdminEmail:
#       #   reefknot.example: admin@reefknot.example

enablePasswordDB: true
staticPasswords:
  # A test person: ana@reefknot.example, password "password" (Dex's own example hash).
  - email: ana@reefknot.example
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: Ana
    userID: 0a4c3c44-6a1f-4f5e-9d2a-0b8f3b1d6e51
