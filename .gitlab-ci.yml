# Jean's CI: budgets, types and tests (npm run check), the smoke tests in Chromium and WebKit
# against the fake brain (npm run e2e), and the packages' audit. The jobs run side by side; going
# over a budget fails the pipeline (AGENTS.md), and so does a known high or critical advisory.
# The image's browsers match the pinned @playwright/test: change both together.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # One pipeline per push: a branch with an open merge request runs as the merge request.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

check:
  stage: test
  script:
    - npm run check

# Every package as the registry signed it, no known high or critical advisory in any of them (one
# in a package that never ships is fixed by an override in package.json, scoped to its parent's
# version), and the bill of materials of what ships, CycloneDX, kept with the pipeline.
audit:
  stage: test
  script:
    - npm audit signatures
    - npm audit --audit-level=high
    - npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json

e2e:
  stage: test
  variables:
    # From the working directory: the report's name alone would land beside test/playwright.config.js.
    PLAYWRIGHT_JUNIT_OUTPUT_FILE: playwright-report/junit.xml
  script:
    - npm run build
    - npm run e2e -- --reporter=list,junit
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: playwright-report/junit.xml
    paths:
      - test-results/
