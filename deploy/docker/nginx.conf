# Jean's files, served as any static host serves them (D232). The image's entrypoint writes this
# into /etc/nginx/conf.d/default.conf, the variable CONTENT_SECURITY_POLICY filled in.

# The brotli copy beside a file (D318), for a browser that takes brotli; for any other, a path no file has.
map $http_accept_encoding $br {
    default "/";
    "~*\bbr\b" .br;
}
# Said of a brotli copy, which nginx's own image, having no brotli module, sends as a file.
map $uri $br_encoding {
    default "";
    "~^/\.br/" br;
}

server {
    listen 8080;
    root /srv;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/manifest+json webmanifest;
        text/markdown md;
        font/ttf ttf;
    }

    # A page answers without its .html too, as jean.is's do: /privacy is privacy.html. A file with a brotli
    # copy, or a page, goes to the location below for a browser that takes brotli.
    location / {
        if (-f $request_filename$br) {
            rewrite ^ /.br$uri last;
        }
        if (-f $request_filename.html$br) {
            rewrite ^ /.br$uri.html last;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    # The brotli copy, under its file's own name so that its type is its file's, and never compressed again.
    location ~ ^/\.br(/.+)$ {
        internal;
        alias /srv$1.br;
        gzip off;
    }

    # brand.js and the install's manifests in the name APP_NAME gives Jean, written as the container started
    # (app-name.sh, D698); Jean's own without it.
    location ~ ^/(brand\.js|manifest\.webmanifest|manifests/[\w-]+\.webmanifest)$ {
        root /tmp/app-name;
        try_files $uri @jean;
    }
    location @jean {
        try_files $uri =404;
    }

    # For a browser that takes no brotli, gzip as it goes: the image keeps no gzip copies.
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json
               application/wasm image/svg+xml text/markdown text/plain font/ttf;

    # Jean's file names carry no version: each is checked again before use, and the service worker
    # keeps them for offline. Only Jean frames Jean's pages. The organisation's policy, if any,
    # is a second one, which browsers enforce as well as Jean's own (docs/enterprise.md).
    add_header Content-Encoding $br_encoding;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;
}
