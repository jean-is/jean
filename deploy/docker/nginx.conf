# Jean's files, served as any static host serves them (D232). The image's entrypoint writes this
# into /etc/nginx/conf.d/default.conf, the variable CONTENT_SECURITY_POLICY filled in.
server {
    listen 8080;
    root /srv;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/manifest+json webmanifest;
        text/markdown md;
        font/ttf ttf;
    }

    # A page answers without its .html too, as jean.is's do: /privacy is privacy.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The gzip copy beside each file, written once at its best (D318); the rest compressed as it goes.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json
               application/wasm image/svg+xml text/markdown text/plain;

    # Jean's file names carry no version: each is checked again before use, and the service worker
    # keeps them for offline. Only Jean frames Jean's pages. The organisation's policy, if any,
    # is a second one, which browsers enforce as well as Jean's own (docs/enterprise.md).
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;
}
