# Jean's services on a server of their own (README.md beside this file): Caddy in front, on ports 80 and 443, of the
# gateway, the share host, the relay, the request service and the hosted copies' files. Nothing is logged: Caddy discards its
# own messages and writes no access log, and Docker keeps no container's output.
#   docker compose up -d
name: jean

x-node: &node
  image: node:26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
  user: "1000:1000"
  logging:
    driver: none
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.11-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./hosted:/srv/hosted:ro
      - caddy:/data
    logging:
      driver: none
    restart: unless-stopped

  gateway:
    <<: *node
    command: node /code/gateway/serve.js
    environment:
      HOST: 0.0.0.0
    env_file: gateway.env
    volumes:
      - ./code:/code:ro

  share:
    <<: *node
    command: node /code/host/serve.js
    environment:
      HOST: 0.0.0.0
      HOST_DIR: /data
      HOST_PROXIED: "1"
    env_file: share.env
    volumes:
      - ./code:/code:ro
      - ./share-data:/data

  relay:
    <<: *node
    command: node /code/relay/serve.js
    environment:
      HOST: 0.0.0.0
      RELAY_DIR: /data
      RELAY_PROXIED: "1"
    env_file: relay.env
    volumes:
      - ./code:/code:ro
      - ./relay-data:/data

  requests:
    <<: *node
    command: node /code/requests/serve.js
    environment:
      HOST: 0.0.0.0
      REQUESTS_DIR: /data
      REQUESTS_PROXIED: "1"
    env_file: requests.env
    volumes:
      - ./code:/code:ro
      - ./requests-data:/data

volumes:
  caddy:
