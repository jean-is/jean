# Jean's chart with the gateway, the relay and NetworkPolicies on, for CI: helm lint --strict, trivy config on what
# helm template writes, and the install in kind under Pod Security "restricted", checked through port-forward
# (scripts/kube-check.js), so neither Route nor Ingress. Every pod runs as a user picked at random as OpenShift's are,
# in group 0, the relay's volume that user's too. The OpenShift branch renders with
#   helm template jean deploy/helm/jean -f deploy/helm/ci-values.yaml --set openshift=true --set route.enabled=true
# which takes the hosts below.
openshift: false

jean:
  host: jean.ci.example
  replicaCount: 1
  appName: CI
  contentSecurityPolicy: "connect-src 'self' https://gateway.ci.example https://relay.ci.example"
  policy:
    capabilities:
      preUnlock: [connections]
  image:
    registry: ""
    repository: jean-ci
    tag: jean
    pullPolicy: Never
  podSecurityContext:
    runAsUser: 1000680000
    runAsGroup: 0

gateway:
  enabled: true
  host: gateway.ci.example
  replicaCount: 2
  image:
    registry: ""
    repository: jean-ci
    tag: gateway
    pullPolicy: Never
  config:
    hosts: [example.com]
  proxy:
    noProxy: .svc,.cluster.local
  podSecurityContext:
    runAsUser: 1000680000
    runAsGroup: 0

relay:
  enabled: true
  host: relay.ci.example
  image:
    registry: ""
    repository: jean-ci
    tag: relay
    pullPolicy: Never
  config:
    limits:
      # kind's disk is small: take messages down to 10 MB free.
      free: 10000000
  persistence:
    size: 2Gi
  podSecurityContext:
    runAsUser: 1000680000
    runAsGroup: 0
    fsGroup: 1000680000

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
