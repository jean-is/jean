{{- if .Values.ingress.enabled }}
{{- range $component := list "jean" "gateway" "relay" }}
{{- $values := index $.Values $component }}
{{- if and (or (eq $component "jean") $values.enabled) $values.host }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $name := include "jean.componentName" $ctx }}
{{- $annotations := merge (deepCopy ($values.ingress.annotations | default dict)) (deepCopy ($.Values.ingress.annotations | default dict)) }}
---
# Each component on a host of its own. What the controller needs, such as the relay's body size and timeouts, goes in
# its annotations: README.md lists them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "jean.labels" $ctx | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $.Values.ingress.tls }}
  tls:
    - hosts:
        - {{ $values.host | quote }}
      {{- with $values.ingress.tlsSecret }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
