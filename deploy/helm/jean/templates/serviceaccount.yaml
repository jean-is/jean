{{- if .Values.serviceAccount.create -}}
# The pods' own account, rather than the namespace's default: no role is bound to it, and no pod mounts its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jean.serviceAccountName" . }}
  labels:
    {{- include "jean.labels" (dict "root" . "component" "jean") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
