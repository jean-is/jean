{{- include "jean.checks" . -}}
{{- $ctx := dict "root" . "component" "jean" -}}
{{- $name := include "jean.componentName" $ctx -}}
{{- $policy := include "jean.policy" . -}}
# Jean's policy.json, served beside index.html.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-policy
  labels:
    {{- include "jean.labels" $ctx | nindent 4 }}
data:
  policy.json: |
    {{- $policy | nindent 4 }}
---
# Jean's files behind nginx, as user 101 outside OpenShift, any user in group 0 on it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "jean.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.jean.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "jean.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jean.labels" $ctx | nindent 8 }}
        {{- with .Values.jean.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A new policy rolls the pods, since a file mounted by subPath never changes in place.
        checksum/policy: {{ $policy | sha256sum }}
        {{- with .Values.jean.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "jean.podSecurity" $ctx | nindent 6 }}
      {{- include "jean.placement" $ctx | nindent 6 }}
      containers:
        - name: jean
          image: {{ include "jean.image" (dict "root" . "image" .Values.jean.image) }}
          imagePullPolicy: {{ .Values.jean.image.pullPolicy }}
          {{- include "jean.containerSecurity" . | nindent 10 }}
          env:
            - name: APP_NAME
              value: {{ .Values.jean.appName | quote }}
            - name: CONTENT_SECURITY_POLICY
              value: {{ .Values.jean.contentSecurityPolicy | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- include "jean.lifecycle" . | nindent 10 }}
          resources:
            {{- toYaml .Values.jean.resources | nindent 12 }}
          volumeMounts:
            # nginx's temporary files and pid, and brand.js and the manifests in APP_NAME's name.
            - name: tmp
              mountPath: /tmp
            # nginx.conf, written as the container starts with CONTENT_SECURITY_POLICY in place.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: policy
              mountPath: /srv/policy.json
              subPath: policy.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: conf
          emptyDir:
            sizeLimit: 1Mi
        - name: policy
          configMap:
            name: {{ $name }}-policy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "jean.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "jean.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
