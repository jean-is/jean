{{- /* Jean and the gateway keep a pod while a node drains, when they have more than one. The relay has one, which a drain replaces. */}}
{{- range $component := list "jean" "gateway" }}
{{- $values := index $.Values $component }}
{{- if and (or (eq $component "jean") $values.enabled) (gt (int $values.replicaCount) 1) }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "jean.componentName" $ctx }}
  labels:
    {{- include "jean.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "jean.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
