<!doctype html>
<meta charset="utf-8">
<title>Video bench</title>
<script type="module">
  // window.bench(job) runs job in a fresh worker, which ends once it answers, so each graph's GPU memory goes with it.
  window.bench = (job) => new Promise((resolve) => {
    const worker = new Worker('/worker.mjs', { type: 'module' })
    worker.onmessage = ({ data }) => { worker.terminate(); resolve(data) }
    worker.onerror = (e) => { worker.terminate(); resolve({ error: e.message }) }
    worker.postMessage(job)
  })
  window.gpu = async () => {
    const adapter = await navigator.gpu?.requestAdapter()
    return adapter && { features: [...adapter.features].filter((f) => /f16|subgroup/.test(f)), info: adapter.info?.description || adapter.info?.architecture, maxBuffer: adapter.limits.maxBufferSize }
  }
</script>
