# Static analysis, beyond the rules scripts/security.js holds in `npm run check`: what flows where in Jean's own JavaScript,
# with CodeQL's security queries, on every push and pull request, and weekly for what it newly knows. Third-party code in
# node_modules and app/vendor isn't read. Findings go to the repository's Security tab.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - app/vendor
              - spikes
              - test
              - dist
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
