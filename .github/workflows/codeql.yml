# Static analysis, beyond the rules scripts/security.js holds in `npm run check`: what flows where in Jean's own JavaScript,
# with CodeQL's security queries, on every push and pull request, and weekly for what it newly knows. Third-party code in
# node_modules and app/vendor isn't read. Findings go to the repository's Security tab.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - app/vendor
              - spikes
              - test
              - dist
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
