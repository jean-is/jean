# Jean's CI on GitHub, as .gitlab-ci.yml is on GitLab: budgets, types and tests (npm run check), the
# packages' audit, and the smoke tests in Chromium and WebKit against the fake brain (npm run e2e).
# The jobs run side by side; going over a budget fails the run (AGENTS.md), and so does a known high
# or critical advisory. Once both pass, a push to main or a version's tag publishes the container
# images to the repository's packages (D639), which only GitHub does. The image's browsers match the
# pinned @playwright/test: change both together, here and in .gitlab-ci.yml. The runners are Ubuntu
# 24.04, as the image is (noble), never ubuntu-latest, which moves under the run.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  # Every package as the registry signed it, no known high or critical advisory, and the bill of
  # materials of what ships, CycloneDX, kept with the run.
  audit:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci --no-audit --no-fund
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - run: npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  # Both container images (D232) in the repository's packages on ghcr.io, pushed with the run's own
  # token: main as edge and sha-<commit>, a version's tag (v0.9) as 0.9 and latest (D639). For amd64
  # and arm64, the Dockerfile building Jean's files once, on the runner's own platform, each image with
  # its build's provenance and its bill of materials.
  images:
    needs: [check, audit]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: jean
            target: ''
            description: Jean, served by nginx without root on port 8080
          - image: jean-gateway
            target: gateway
            description: Jean's gateway, on Node on port 8787, for the services a browser can't reach
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The package's page reads a multi-platform image's description from its index, so the
      # annotations go there as well as on each platform's image.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=sha
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

