# Jean's CI on GitHub, as .gitlab-ci.yml is on GitLab: budgets, types and tests (npm run check), the
# packages' audit, and the smoke tests in Chromium and WebKit against the fake brain (npm run e2e).
# The jobs run side by side; going over a budget fails the run (AGENTS.md), and so does a known high
# or critical advisory. Once both pass, a push to main or a version's tag publishes the container
# images to the repository's packages (D639), and a push to main deploys jean.is and Jean's server
# (D320 · D659), which only GitHub does. The image's browsers match the
# pinned @playwright/test: change both together, here and in .gitlab-ci.yml. The runners are Ubuntu
# 24.04, as the image is (noble), never ubuntu-latest, which moves under the run.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push replaces a run of the same branch, but on main a run goes to its end: its deploy is never cut short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  # Every package as the registry signed it, no known high or critical advisory, and the bill of
  # materials of what ships, CycloneDX, kept with the run.
  audit:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci --no-audit --no-fund
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - run: npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  # Both container images (D232) in the repository's packages on ghcr.io, pushed with the run's own
  # token: main as edge and sha-<commit>, a version's tag (v0.9) as 0.9 and latest (D639). For amd64
  # and arm64, the Dockerfile building Jean's files once, on the runner's own platform, each image with
  # its build's provenance and its bill of materials.
  images:
    needs: [check, audit]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: jean
            target: ''
            description: Jean, served by nginx without root on port 8080
          - image: jean-gateway
            target: gateway
            description: Jean's gateway, on Node on port 8787, for the services a browser can't reach
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The package's page reads a multi-platform image's description from its index, so the
      # annotations go there as well as on each platform's image.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=sha
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # The commit pushed to main, live (D320 · D659): jean.is on Bunny with npm run deploy, which first
  # publishes the render package it names, through npm's trusted publishing (no token: npm checks this
  # workflow and environment, and records it as the version's provenance); then the gateway, the key
  # service and the share host on Jean's server at the same commit, sent as a tar through a key that
  # may run nothing but the server's update script (deploy/server/update.sh). Everything that names a
  # place or opens one comes from the environment jean.is, which only main can use: its variables
  # DEPLOY_TO, BUNNY_PULL_ZONE, POLICY, ADDRESS, KEYS, SERVER (user@address) and SERVER_HOST_KEYS (its
  # known_hosts lines), and its secrets BUNNY_STORAGE_KEY, BUNNY_API_KEY and SERVER_KEY.
  deploy:
    needs: [check, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: jean.is
    concurrency:
      group: deploy-jean.is
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # npm 11.5.1 or later publishes with the workflow's identity; Node 24 brings it.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: jean.is on Bunny
        run: npm run deploy
        env:
          DEPLOY_TO: ${{ vars.DEPLOY_TO }}
          BUNNY_PULL_ZONE: ${{ vars.BUNNY_PULL_ZONE }}
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          POLICY: ${{ vars.POLICY }}
          ADDRESS: ${{ vars.ADDRESS }}
          KEYS: ${{ vars.KEYS }}
      - name: Jean's server at the same commit
        run: |
          npm run host
          mkdir -p stage/host ~/.ssh
          cp dist/host/host.js dist/host/serve.js dist/host/viewer.json dist/host/package.json stage/host/
          git archive HEAD gateway/gateway.js gateway/serve.js requests/requests.js requests/serve.js | tar -x -C stage
          printf '%s\n' "$SERVER_HOST_KEYS" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/deploy && printf '%s\n' "$SERVER_KEY" > ~/.ssh/deploy
          tar -C stage -cf - gateway host requests | ssh -T -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SERVER"
        env:
          SERVER: ${{ vars.SERVER }}
          SERVER_HOST_KEYS: ${{ vars.SERVER_HOST_KEYS }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}

